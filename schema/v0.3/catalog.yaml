policies:
  - policyId: FINOPS-001
    severity: error
    message: All production resources must have costCenter tag
    checkType: require_tag
    conditions:
      when:
        architecture.environment: prod
      check:
        type: require_tag
        tag: costCenter
    category: finops
  - policyId: FINOPS-002
    severity: error
    message: All resources must have owner tag
    checkType: require_tag
    conditions:
      when: null
      check:
        type: require_tag
        tag: owner
    category: finops
  - policyId: FINOPS-003
    severity: error
    message: All resources must have environment tag
    checkType: require_tag
    conditions:
      when: null
      check:
        type: require_tag
        tag: env
    category: finops
  - policyId: FINOPS-004
    severity: warning
    message: All resources should have app tag
    checkType: require_tag
    conditions:
      when: null
      check:
        type: require_tag
        tag: app
    category: finops
  - policyId: FINOPS-005
    severity: error
    message: Production architectures must define a budget
    checkType: require_tag
    conditions:
      when:
        architecture.environment: prod
      check:
        type: require_field
        path: finops.budget.monthlyLimit
    category: finops
  - policyId: FINOPS-006
    severity: warning
    message: S3 buckets should have lifecycle policy
    checkType: require_tag
    conditions:
      when: null
      check:
        type: require_property
        componentType: aws.s3
        property: lifecyclePolicy
    category: finops
  - policyId: FINOPS-007
    severity: warning
    message: CloudWatch log groups should define retention
    checkType: require_tag
    conditions:
      when: null
      check:
        type: require_property
        componentType: aws.cloudwatch.logs
        property: retentionDays
    category: finops
  - policyId: FINOPS-008
    severity: warning
    message: NAT Gateway should be associated with costCenter tag
    checkType: require_tag
    conditions:
      when: null
      check:
        type: require_tag
        componentType: aws.nat-gateway
        tag: costCenter
    category: finops
  - policyId: FINOPS-009
    severity: warning
    message: RDS instances should declare backup retention
    checkType: require_tag
    conditions:
      when: null
      check:
        type: require_property
        componentType: aws.rds
        property: backupRetention
    category: finops
  - policyId: FINOPS-010
    severity: error
    message: Resources without any tags cannot pass in CI/CD
    checkType: require_tag
    conditions:
      when: null
      check:
        type: require_any_tags
    category: finops
  - policyId: OPS-001
    severity: error
    message: Production architectures must have an owner
    checkType: require_tag
    conditions:
      when:
        architecture.environment: prod
      check:
        type: require_field
        path: architecture.owner
    category: ops
  - policyId: OPS-002
    severity: warning
    message: All architectures should have a description
    checkType: require_tag
    conditions:
      when: null
      check:
        type: require_field
        path: architecture.name
    category: ops
  - policyId: OPS-003
    severity: error
    message: RDS Multi-AZ should not be enabled on dev/test environments
    checkType: require_tag
    conditions:
      when:
        architecture.environment:
          - dev
          - test
          - sandbox
      check:
        type: forbid_property_value
        componentType: aws.rds
        property: multiAZ
        value: true
    category: ops
